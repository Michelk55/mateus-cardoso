    onMount(el, api) {
      paint();
      function paint() {
        const cl = closing(sid, mk);
        const s = student(sid);
        const body =
          '<div style="padding:8px 0 16px">' +
          '<div style="font-size:23px;font-weight:600;letter-spacing:-.02em">' + esc(studentName(sid)) + '</div>' +
          '<div class="subtle" style="margin-top:4px">' + monthLabel(mk) + '</div>' +
          '<div style="margin-top:10px">' + payTag(cl.status) + '</div></div>' +

          '<div class="card" style="padding:16px">' +
          '<span class="subtle" style="font-size:13px">Total do mês</span>' +
          '<div class="money-big" style="margin-top:2px">' + money(cl.total) + '</div>' +
          '<div class="subtle" style="font-size:13px;margin-top:4px">' + cl.count + (cl.count === 1 ? ' aula cobrada' : ' aulas cobradas') + '</div></div>' +

          '<div class="section-title">Aulas cobradas</div>' +
          (cl.billed.length ? '<div class="card">' + cl.billed.map(c =>
            '<div class="kv" data-cls="' + c.id + '"><span>' + fmtDayMonth(c.date) + ' · ' + c.startTime + ' · ' + statusInfo(c).label + '</span><b>' + money(c.price) + '</b></div>').join('') +
            '<div class="kv" style="background:#FAFBFA"><span style="font-weight:600;color:var(--ink)">Subtotal</span><b>' + money(cl.subtotal) + '</b></div></div>'
            : '<div class="card"><div class="kv"><span>Nenhuma aula cobrada neste mês</span><b>' + money(0) + '</b></div></div>') +

          (cl.others.length ? '<div class="section-title">Não entraram no fechamento</div><div class="card">' +
            cl.others.map(c => '<div class="kv" data-cls="' + c.id + '"><span>' + fmtDayMonth(c.date) + ' · ' + statusInfo(c).label + '</span>' +
              '<b style="font-weight:500;color:var(--ink-3)">' + (c.shouldCharge ? 'aula futura' : 'não cobrada') + '</b></div>').join('') + '</div>' : '') +

          '<div class="section-title">Ajustes</div><div class="card">' +
          (cl.adj.length ? cl.adj.map(a =>
            '<div class="kv"><span>' + esc(a.description) + '</span><b style="color:' + (a.type === 'desconto' ? 'var(--danger)' : 'var(--brand)') + '">' +
            (a.type === 'desconto' ? '- ' : '+ ') + money(Math.abs(a.amount)) +
            ' <button class="link" data-deladj="' + a.id + '" style="margin-left:8px">remover</button></b></div>').join('') : '') +
          '<div class="kv"><button class="link" data-addadj>+ Adicionar ajuste</button><b></b></div></div>' +

          '<div class="card" style="margin-top:10px;background:#FAFBFA">' +
          '<div class="kv"><span>Subtotal</span><b>' + money(cl.subtotal) + '</b></div>' +
          (cl.adjTotal ? '<div class="kv"><span>Ajustes</span><b>' + (cl.adjTotal < 0 ? '- ' : '+ ') + money(Math.abs(cl.adjTotal)) + '</b></div>' : '') +
          '<div class="kv"><span style="color:var(--ink);font-weight:600">Total final</span><b style="font-size:17px">' + money(cl.total) + '</b></div></div>' +

          (cl.payment && cl.payment.status === 'pago'
            ? '<div class="card" style="margin-top:10px"><div class="kv"><span>Pago em</span><b>' + (cl.payment.paymentDate ? fmtDateNum(cl.payment.paymentDate) : '—') + '</b></div>' +
              '<div class="kv"><span>Forma</span><b>' + esc(cl.payment.paymentMethod || '—') + '</b></div>' +
              '<div class="kv"><span>Valor recebido</span><b>' + money(cl.payment.amount) + '</b></div></div>' : '') +

          '<div style="margin-top:18px">' +
          '<button class="btn btn-primary btn-block" data-charge>' + ico('whats') + 'Cobrar no WhatsApp</button>' +
          (cl.status === 'pago'
            ? '<button class="btn btn-ghost btn-block" data-unpay style="margin-top:10px">Marcar como pendente</button>'
            : '<button class="btn btn-soft btn-block" data-pay style="margin-top:10px">Marcar como pago</button>') +
          '<button class="btn btn-ghost btn-block" data-preview style="margin-top:10px">Ver mensagem antes de enviar</button>' +
          '</div><div style="height:10px"></div>';

        api.replaceBody(body);
        const done = () => { paint(); render(); onChange && onChange(); };

        $$('[data-cls]', el).forEach(b => b.onclick = () => openClass(b.dataset.cls, done));
        $('[data-addadj]', el).onclick = () => adjustmentSheet(sid, mk, done);
        $$('[data-deladj]', el).forEach(b => b.onclick = ev => {
          ev.stopPropagation();
          confirmModal({
            title: 'Remover ajuste?', danger: true, confirmLabel: 'Remover',
            onConfirm: () => { DB.adjustments = DB.adjustments.filter(a => a.id !== b.dataset.deladj); DB.write('adjustments'); toast('Ajuste removido'); done(); }
          });

          openWhats(s.phone, chargeMessage(c2));
          upsertPayment(sid, mk, { status: c2.status === 'pago' ? 'pago' : 'cobrado', chargedAt: nowISO() });
          toast('Cobrança registrada');
          done();
        };
        $('[data-preview]', el).onclick = () => {
          const msg = chargeMessage(closing(sid, mk));
          sheet('Mensagem de cobrança',
            '<div class="card" style="padding:14px;white-space:pre-wrap;font-size:14.5px;line-height:1.55">' + esc(msg) + '</div>' +

            '<button class="btn btn-ghost btn-block" data-tpl style="margin-top:10px">Editar mensagem padrão</button>',

              onMount(sel, close) {
                $('[data-send]', sel).onclick = () => { close(); $('[data-charge]', el).click(); };
                $('[data-tpl]', sel).onclick = () => { close(); setTimeout(openTemplate, 180); };
              }
            });
        };
        const pb = $('[data-pay]', el);
        if (pb) pb.onclick = () => payLoop(sid, mk, done);
        const ub = $('[data-unpay]', el);
        if (ub) ub.onclick = () => confirmModal({
          title: 'Marcar como pendente?', text: 'O pagamento registrado será desfeito.', danger: true, confirmLabel: 'Desfazer',
          onConfirm: () => { upsertPayment(sid, mk, { status: 'cobrado', amount: 0, paidAt: null, paymentDate: null }); toast('Pagamento desfeito'); done(); }
        });
      }
    }
  });
}

function adjustmentSheet(sid, mk, after) {
  const html =
    '<div class="segment" id="aj-type" style="margin-top:4px">' +
    '<button data-t="desconto" class="on">Desconto</button><button data-t="acrescimo">Acréscimo</button></div>' +
    field('aj-desc', 'Descrição', 'placeholder="Ex.: Desconto especial"') +
    field('aj-val', 'Valor', 'inputmode="numeric" placeholder="R$ 0,00"') +
    '<button class="btn btn-primary btn-block" data-go style="margin-top:18px">Adicionar ajuste</button>';
  sheet('Novo ajuste', html, {
    onMount(el, close) {
      let type = 'desconto';
      bindMask($('#aj-val', el), maskMoneyInput);
      $$('#aj-type button', el).forEach(b => b.onclick = () => {
        type = b.dataset.t; $$('#aj-type button', el).forEach(x => x.classList.toggle('on', x === b));
      });
      $('[data-go]', el).onclick = () => {
        const desc = $('#aj-desc', el).value.trim() || (type === 'desconto' ? 'Desconto' : 'Acréscimo');
        const val = parseMoney($('#aj-val', el).value);
        if (!(val > 0)) { showError($('#aj-val', el), $('#aj-val-e', el), 'Informe um valor maior que zero.'); return; }
        DB.adjustments.push(stamp({ id: uid(), studentId: sid, referenceMonth: mk, type, description: desc, amount: val }));
        DB.write('adjustments');
        close(); toast('Ajuste adicionado'); after && after();
      };
      setTimeout(() => $('#aj-desc', el).focus(), 340);
    }
  });
}

function payLoop(sid, mk, after) {
  const cl = closing(sid, mk);
  const html =
    field('pg-val', 'Valor recebido', 'inputmode="numeric" value="' + maskMoneyInput(String(Math.round(cl.total * 100))) + '"') +
    field('pg-date', 'Data do pagamento', 'type="date" value="' + todayISO() + '"') +
    '<div class="field"><label>Forma de pagamento</label><div class="chips" id="pg-m">' +
    ['PIX', 'Dinheiro', 'Transferência', 'Outro'].map((m, i) => '<button class="chip' + (i === 0 ? ' on' : '') + '" data-m="' + m + '">' + m + '</button>').join('') +
    '</div></div>' +
    '<div class="field"><label for="pg-obs">Observação</label><input class="input" id="pg-obs" placeholder="opcional"></div>' +
    '<button class="btn btn-primary btn-block" data-go style="margin-top:18px">Registrar pagamento</button>';
  sheet('Marcar como pago', html, {
    onMount(el, close) {
      let method = 'PIX';
      bindMask($('#pg-val', el), maskMoneyInput);
      $$('#pg-m button', el).forEach(b => b.onclick = () => { method = b.dataset.m; $$('#pg-m button', el).forEach(x => x.classList.toggle('on', x === b)); });
      $('[data-go]', el).onclick = () => {
        const amount = parseMoney($('#pg-val', el).value);
        if (!(amount > 0)) { showError($('#pg-val', el), $('#pg-val-e', el), 'Informe o valor recebido.'); return; }
        upsertPayment(sid, mk, {
          status: 'pago', amount, paymentDate: $('#pg-date', el).value || todayISO(),
          paymentMethod: method, paidAt: nowISO(), notes: $('#pg-obs', el).value.trim()
        });
        close(); toast('Pagamento registrado'); after && after();
      };
    }
  });
}

    '<div class="row-main"><b style="font-size:16.5px">' + esc(p.name) + '</b><span>' + esc(p.role) + '</span></div>' + ico('chev', 'chev') + '</button>' +

    '<div class="section-title">Cobrança</div><div class="card">' +
    rowItem('pix', 'money', 'Chave PIX', DB.config.pix || 'Não definida') +
    '<div class="divider"></div>' +
    rowItem('tpl', 'doc', 'Mensagem de cobrança', 'Personalizar texto') + '</div>' +

    '<div class="section-title">Preferências</div><div class="card">' +
    rowItem('dur', 'clock', 'Duração padrão da aula', DB.config.defaultDuration + ' min') + '</div>' +

    '<div class="section-title">Dados da plataforma</div><div class="card">' +
    rowItem('stats', 'doc', 'Resumo dos dados', DB.students.length + ' alunos · ' + DB.classes.length + ' aulas') +
    '<div class="divider"></div>' + rowItem('export', 'down', 'Exportar backup (.json)', 'Recomendado antes de trocar de aparelho') +
    '<div class="divider"></div>' + rowItem('import', 'up', 'Importar backup', 'Substitui os dados atuais') +
    '<div class="divider"></div>' + rowItem('demo', 'refresh', 'Restaurar dados de demonstração', '') +
    '<div class="divider"></div>' + rowItem('wipe', 'trash', 'Apagar todos os dados locais', '', true) + '</div>' +

    '<div class="card" style="margin-top:20px">' + rowItem('out', 'out', 'Sair da conta', '', true) + '</div>' +
    '<p class="hint" style="text-align:center;margin:20px 0 6px">Protótipo local · os dados ficam apenas neste navegador.</p>' +
    '</div>';

  $$('[data-m]').forEach(b => b.onclick = () => maisAction(b.dataset.m));
}
function rowItem(key, icon, title, sub, danger) {
  return '<button class="row" data-m="' + key + '" style="width:100%">' +
    '<div class="avatar" style="width:36px;height:36px;border-radius:12px;background:' + (danger ? 'var(--danger-soft)' : 'var(--brand-soft)') + ';color:' + (danger ? 'var(--danger)' : 'var(--brand)') + '">' + ico(icon) + '</div>' +
    '<div class="row-main"><b style="font-size:14.5px' + (danger ? ';color:var(--danger)' : '') + '">' + esc(title) + '</b>' +
    (sub ? '<span>' + esc(sub) + '</span>' : '') + '</div>' + ico('chev', 'chev') + '</button>';
}

function maisAction(k) {
  if (k === 'perfil') return openProfile();
  if (k === 'pix') return openPix();
  if (k === 'tpl') return openTemplate();
  if (k === 'dur') return optionSheet('Duração padrão', DURATIONS.map(d => ({
    label: d + ' minutos', icon: 'clock',
    action: () => { DB.config.defaultDuration = d; DB.write('config'); toast('Duração padrão: ' + d + ' min'); render(); }
  })));
  if (k === 'stats') return sheet('Resumo dos dados',
    '<div class="card">' +
    '<div class="kv"><span>Alunos ativos</span><b>' + DB.students.filter(s => s.status === 'ativo').length + '</b></div>' +
    '<div class="kv"><span>Alunos inativos</span><b>' + DB.students.filter(s => s.status !== 'ativo').length + '</b></div>' +
    '<div class="kv"><span>Aulas registradas</span><b>' + DB.classes.length + '</b></div>' +
    '<div class="kv"><span>Pagamentos</span><b>' + DB.payments.length + '</b></div>' +
    '<div class="kv"><span>Ajustes</span><b>' + DB.adjustments.length + '</b></div></div>');
  if (k === 'export') return exportData();
  if (k === 'import') return importData();
  if (k === 'demo') return confirmModal({
    title: 'Restaurar dados de demonstração',
    text: 'Isso substituirá seus dados atuais pelos dados de demonstração. Deseja continuar?',
    confirmLabel: 'Restaurar', danger: true,
    onConfirm: () => { seedDemo(); toast('Dados de demonstração restaurados'); go('hoje'); }
  });
  if (k === 'wipe') return confirmModal({
    title: 'Apagar todos os dados?',
    text: 'Alunos, aulas, pagamentos e ajustes serão removidos deste navegador. Não há como desfazer.',
    confirmLabel: 'Apagar tudo', danger: true,
    onConfirm: () => {
      DB.students = []; DB.classes = []; DB.payments = []; DB.adjustments = [];
      DB.saveAll(); toast('Dados apagados'); go('hoje');
    }
  });
  if (k === 'out') return confirmModal({
    title: 'Sair da conta?', text: 'Seus dados continuam salvos neste aparelho.', confirmLabel: 'Sair', danger: true,
    onConfirm: () => { localStorage.removeItem(KEYS.session); location.reload(); }
  });
}

function openProfile() {
  const p = DB.config.profile;
  pushScreen({
    title: 'Perfil',
    body:
      '<div style="text-align:center;padding:14px 0 6px">' +
      '<div class="avatar" style="width:74px;height:74px;border-radius:24px;font-size:23px;margin:0 auto">' + initials(p.name) + '</div></div>' +
      field('pf-name', 'Nome', 'value="' + esc(p.name) + '"') +
      field('pf-role', 'Profissão', 'value="' + esc(p.role) + '"') +
      field('pf-phone', 'Telefone', 'inputmode="tel" value="' + esc(p.phone) + '"') +
      field('pf-mail', 'E-mail', 'inputmode="email" value="' + esc(p.email) + '"') +
      field('pf-pix', 'Chave PIX', 'value="' + esc(DB.config.pix) + '"', 'Usada automaticamente nas mensagens de cobrança.'),
    foot: '<button class="btn btn-primary btn-block" data-save>Salvar</button>',
    onMount(el, api) {
      bindMask($('#pf-phone', el), maskPhone);
      $('[data-save]', el).onclick = () => {
        const name = $('#pf-name', el).value.trim();
        if (name.length < 2) { showError($('#pf-name', el), $('#pf-name-e', el), 'Informe seu nome.'); return; }
        DB.config.profile = { name, role: $('#pf-role', el).value.trim(), phone: $('#pf-phone', el).value.trim(), email: $('#pf-mail', el).value.trim(), avatar: '' };
        DB.config.pix = $('#pf-pix', el).value.trim();
        DB.config.updatedAt = nowISO(); DB.write('config');
        api.close(); toast('Perfil atualizado'); render();
      };
    }
  });
}

function openPix() {
  sheet('Chave PIX',
    field('px-k', 'Chave', 'value="' + esc(DB.config.pix || '') + '" placeholder="CPF, e-mail, telefone ou chave aleatória"') +
    '<button class="btn btn-primary btn-block" data-go style="margin-top:18px">Salvar chave</button>',
    {
      onMount(el, close) {
        $('[data-go]', el).onclick = () => {
          DB.config.pix = $('#px-k', el).value.trim(); DB.config.updatedAt = nowISO(); DB.write('config');
          close(); toast('Chave PIX atualizada'); render();
        };
      }
    });
}

function openTemplate() {
  const sample = DB.students[0];
  pushScreen({
    title: 'Mensagem de cobrança',
    body:
      '<div class="field"><label for="tp-t">Texto</label>' +
      '<textarea class="input" id="tp-t" style="min-height:190px">' + esc(DB.config.chargeTemplate) + '</textarea></div>' +
      '<div class="hint">Variáveis disponíveis: {nome} {mes} {quantidade} {valor} {pix}</div>' +
      '<div class="section-title">Pré-visualização</div>' +
      '<div class="card" id="tp-prev" style="padding:14px;white-space:pre-wrap;font-size:14.5px;line-height:1.55"></div>' +
      '<button class="btn btn-ghost btn-block" data-reset style="margin-top:14px">Restaurar texto padrão</button>',
    foot: '<button class="btn btn-primary btn-block" data-save>Salvar mensagem</button>',
    onMount(el, api) {
      const ta = $('#tp-t', el), prev = $('#tp-prev', el);
      const paint = () => {
        prev.textContent = String(ta.value)
          .replace(/{nome}/g, sample ? sample.name.split(' ')[0] : 'João')
          .replace(/{mes}/g, monthName(thisMonth()))
          .replace(/{quantidade}/g, '8')
          .replace(/{valor}/g, money(960))
          .replace(/{pix}/g, DB.config.pix || '—');
      };
      ta.oninput = paint; paint();
      $('[data-reset]', el).onclick = () => { ta.value = DEFAULT_TEMPLATE; paint(); };
      $('[data-save]', el).onclick = () => {
        DB.config.chargeTemplate = ta.value; DB.config.updatedAt = nowISO(); DB.write('config');
        api.close(); toast('Mensagem salva');
      };
    }
  });
}

/* --- backup --- */
function exportData() {
  const dump = { version: 1, exportedAt: nowISO(), config: DB.config, students: DB.students, classes: DB.classes, payments: DB.payments, adjustments: DB.adjustments };
  const blob = new Blob([JSON.stringify(dump, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'mateus-cardoso-backup-' + todayISO() + '.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  toast('Backup exportado');
}
function importData() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!d || !Array.isArray(d.students)) throw new Error('formato');
        confirmModal({
          title: 'Importar backup?', text: 'Os dados atuais deste navegador serão substituídos.',
          confirmLabel: 'Importar', danger: true,
          onConfirm: () => {
            DB.config = Object.assign({}, DEFAULT_CONFIG, d.config || {});
            DB.students = d.students || []; DB.classes = d.classes || [];
            DB.payments = d.payments || []; DB.adjustments = d.adjustments || [];
            DB.saveAll(); toast('Backup importado'); go('hoje');
          }
        });
      } catch (e) { toast('Arquivo inválido'); }
    };
    r.readAsText(f);
  };
  inp.click();
}

/* ====================================================================== */
/* LOGIN + BOOT                                                            */
/* ====================================================================== */
function boot() {
  DB.loadAll();
  if (!localStorage.getItem('mc.seeded')) {
    seedDemo();
    localStorage.setItem('mc.seeded', '1');
  }
  const logged = localStorage.getItem(KEYS.session);
  const login = $('#login');
  if (logged) { login.classList.add('out'); login.style.display = 'none'; }
  go('hoje');

  const mail = $('#lg-mail'), pass = $('#lg-pass');
  $('#lg-go').onclick = () => {
    let ok = true;
    if (!mail.value.trim()) { showError(mail, $('#lg-mail-e'), 'Informe seu e-mail.'); ok = false; }
    if (!pass.value.trim()) { showError(pass, $('#lg-pass-e'), 'Informe sua senha.'); ok = false; }
    if (!ok) return;
    localStorage.setItem(KEYS.session, JSON.stringify({ email: mail.value.trim(), at: nowISO() }));
    login.classList.add('out');
    setTimeout(() => { login.style.display = 'none'; }, 400);
    go('hoje');
    setTimeout(() => toast('Bem-vindo de volta, ' + DB.config.profile.name.split(' ')[0]), 500);
  };
  pass.addEventListener('keydown', e => { if (e.key === 'Enter') $('#lg-go').click(); });
  $('#lg-forgot').onclick = () => confirmModal({
    title: 'Recuperação de senha', text: 'Recuperação de senha estará disponível em breve.',
    cancelLabel: 'Fechar', confirmLabel: 'Entendi', onConfirm: () => { }
  });

  /* botão voltar do celular fecha telas empilhadas */
  window.addEventListener('popstate', () => { if (stack.length) { stack[stack.length - 1].close(); history.pushState(null, ''); } });
  history.pushState(null, '');
}

boot();
})();
</script>
